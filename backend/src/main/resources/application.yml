spring:
  application:
    name: parking-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project_db}
    username: ${SPRING_DATASOURCE_USERNAME:project_user}
    password: ${SPRING_DATASOURCE_PASSWORD:project_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:Zm9yLWxvY2FsLWRldi1vbmx5LWNoYW5nZS1tZS1wYXJraW5nLTEyMzQ1Njc4OTA=}
    issuer: ${JWT_ISSUER:parking}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    name: ${BOOTSTRAP_ADMIN_NAME:Администратор}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
