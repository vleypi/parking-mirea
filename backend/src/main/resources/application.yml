spring:
  application:
    name: parking-server

  # Та же база, что у JavaFX-версии КР2 (docker/docker-compose.yml).
  # Значения можно переопределить переменными окружения из .env.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project_db}
    username: ${SPRING_DATASOURCE_USERNAME:project_user}
    password: ${SPRING_DATASOURCE_PASSWORD:project_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    # Не держать соединение с БД открытым до конца HTTP-ответа: все запросы к БД только в сервисах.
    open-in-view: false
    hibernate:
      # Hibernate ничего не создаёт сам, только сверяет сущности со схемой.
      # Схему меняют исключительно миграции Flyway.
      ddl-auto: validate

  flyway:
    enabled: true
    # База КР2 уже содержит таблицы (их создаёт sql/init.sql), но в ней нет истории Flyway.
    # baseline помечает V1 как уже применённую и дальше накатывает только V2, V3, ...
    # На пустой базе baseline не срабатывает и V1 выполняется как обычно.
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Неизвестное поле в JSON-запросе даёт 400, а не молча игнорируется
      fail-on-unknown-properties: true

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Настройки приложения. Значения берутся из переменных окружения (.env),
# после двоеточия значение по умолчанию для локального запуска.
app:
  jwt:
    # Секрет подписи JWT в Base64. Значение по умолчанию только для локальной разработки.
    secret-base64: ${JWT_SECRET_BASE64:Zm9yLWxvY2FsLWRldi1vbmx5LWNoYW5nZS1tZS1wYXJraW5nLTEyMzQ1Njc4OTA=}
    issuer: ${JWT_ISSUER:parking}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    # Первый администратор создаётся на пустой базе, если заданы логин и пароль
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    name: ${BOOTSTRAP_ADMIN_NAME:Администратор}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
