<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в Swagger</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 24px; border-radius: 8px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 0 0 16px; }
    label { display: block; font-size: 14px; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
    button { margin-top: 16px; width: 100%; padding: 10px; font-size: 14px; cursor: pointer; }
    #error { color: #b00020; font-size: 14px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
<form id="form">
  <h1>Swagger: вход администратора</h1>
  <label for="login">Логин</label>
  <input id="login" autocomplete="username" required>
  <label for="password">Пароль</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button type="submit">Войти</button>
  <div id="error"></div>
</form>
<script>
  document.getElementById('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = document.getElementById('error');
    error.textContent = '';
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        login: document.getElementById('login').value,
        password: document.getElementById('password').value
      })
    });
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      error.textContent = problem.detail || 'Ошибка входа';
      return;
    }
    window.location.href = '/swagger-ui.html';
  });
</script>
</body>
</html>
